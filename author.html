<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Автор | Электронный архив публикаций кафедры онтологии и теории познания</title>
    <link rel="stylesheet" href="visual.css">
</head>
<body>
    <div class="container">
        <button class="back-btn" onclick="window.location.href='index.html'">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
            К списку авторов
        </button>

        <div class="author-header" id="authorHeader">
            <h1 id="authorName">Загрузка...</h1>
        </div>

        <div class="works-section">
            <div class="section-title">
                <div class="section-title-left">
                    <h2>Научные работы</h2>
                    <span class="works-count-badge" id="worksCount">0</span>
                </div>
                <div class="works-filter" id="worksFilter"></div>
            </div>

            <div class="works-search">
                <input type="text" id="worksSearchInput" class="works-search-input" placeholder="Поиск по названию работы...">
            </div>

            <div class="works-list" id="worksList"></div>
        </div>
    </div>

    <!-- Модальное окно -->
    <div class="modal" id="workModal">
        <div class="modal-overlay"></div>
        <div class="modal-container">
            <button class="modal-close" id="modalClose">&times;</button>
            <div class="modal-content">
                <h3 class="modal-title" id="modalTitle"></h3>
                <div class="modal-description" id="modalDescription">
                    <p>Библиографическое описание</p>
                    <div id="modalBiblio"></div>
                </div>
                <div class="modal-actions">
                    <button class="modal-open-btn" id="modalOpenBtn">📄 Открыть работу</button>
                </div>
            </div>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
